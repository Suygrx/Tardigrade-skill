[tool.pytest.ini_options]
pythonpath = ["core", "server"]
testpaths = ["tests"]

[project]
name = "tardigrade-skill"
version = "0.2.0"
description = "Desktop manager + adaptation engine for Agent Skills"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
server = ["fastapi>=0.111", "uvicorn>=0.30", "httpx>=0.27"]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "fastapi>=0.111", "uvicorn>=0.30"]

[project.scripts]
tardigrade-skill = "tardigrade_skill.cli:main"
